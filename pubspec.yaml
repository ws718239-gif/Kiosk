name: kiosk
description: "A Visitor Check-in Kiosk App."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^2.0.0

  # State Management & Routing
  flutter_riverpod: ^3.4.3
  go_router: any
  google_fonts: ^6.1.0

  # Networking
  dio: any

  # Data & Models
  intl: any

  # Core Features
  camera: any
  permission_handler: ^12.0.3
  qr_flutter: any
  shared_preferences: any
  image: any
  flex_color_picker: any
  riverpod_annotation: ^4.0.7
  state_notifier: ^1.0.0
  freezed_annotation: any
  json_annotation: any
  flutter_screenutil: ^5.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: any
  freezed: any
  json_serializable: any

flutter:
  uses-material-design: true
